[project]
name = "p1-core"
version = "0.1.0"
description = "P1 政务智能知识库平台核心引擎：知识采集、解析与切分"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "P1 Platform Team", email = "p1-platform@example.local" },
]
keywords = ["rag", "knowledge-base", "government", "document-parsing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    # 仅基础工程依赖；解析栈依赖（pypdfium2/pdfplumber/pytesseract/python-docx/selectolax）
    # 在 Stage 2/3 按需引入。
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<7",
    "hypothesis>=6.100,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pre-commit>=4.0,<5",
]

[project.urls]
Homepage = "https://github.com/tomllt/gov-knowledge-base"
Issues = "https://github.com/tomllt/gov-knowledge-base/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p1_core"]

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=p1_core",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=85",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# ----------------------------------------------------------------------
# coverage
# ----------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["p1_core"]
omit = [
    "src/p1_core/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ----------------------------------------------------------------------
# ruff (lint + format)
# ----------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "PL",   # pylint
    "RUF",  # ruff-specific
    "ANN",  # annotations
    "RET",  # return
    "TRY",  # tryceratops
    "PTH",  # use-pathlib
    "ERA",  # eradicate commented-out code
]
ignore = [
    "PLR0913",  # too-many-arguments (collectors need many config keys)
    "PLR2004",  # magic value (used in docs/asserts intentionally)
    "RUF002",   # docstring contains ambiguous fullwidth punctuation (中文文档故意保留)
    "RUF003",   # comment contains ambiguous fullwidth punctuation
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN101",  # missing type annotation for self
    "PLR2004",  # magic value
    "S101",     # assert (pytest style)
    "S105",     # hard-coded password
    "S106",
]

[tool.ruff.lint.isort]
known-first-party = ["p1_core"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ----------------------------------------------------------------------
# mypy (strict)
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = []
exclude = [
    ".venv",
    "build",
    "dist",
]
mypy_path = "src"

