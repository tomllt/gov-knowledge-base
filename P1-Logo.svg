<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="p1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="p1-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="p1-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <filter id="p1-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.2"/>
    </filter>
    <filter id="p1-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 背景 -->
  <rect width="200" height="200" rx="16" fill="url(#p1-bg)"/>
  <!-- 装饰性同心圆环 -->
  <circle cx="100" cy="90" r="75" fill="none" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <circle cx="100" cy="90" r="60" fill="none" stroke="#DBEAFE" stroke-width="0.8" opacity="0.3"/>
  <!-- 六边形核心节点 -->
  <polygon points="100,40 145,67 145,117 100,144 55,117 55,67" fill="url(#p1-grad)" opacity="0.95" filter="url(#p1-shadow)"/>
  <polygon points="100,48 137,70 137,114 100,136 63,114 63,70" fill="none" stroke="#DBEAFE" stroke-width="1.5" opacity="0.6"/>
  <!-- 六边形内部渐变装饰 -->
  <polygon points="100,55 130,73 130,109 100,127 70,109 70,73" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>
  <!-- 中心光点 -->
  <circle cx="100" cy="92" r="8" fill="#FFFFFF" opacity="0.9" filter="url(#p1-glow)"/>
  <circle cx="100" cy="92" r="3" fill="#93C5FD"/>
  <!-- 连接线（向外辐射） -->
  <line x1="100" y1="144" x2="100" y2="170" stroke="#2563EB" stroke-width="2.5" opacity="0.6"/>
  <line x1="145" y1="117" x2="168" y2="135" stroke="#2563EB" stroke-width="2.5" opacity="0.6"/>
  <line x1="55" y1="117" x2="32" y2="135" stroke="#2563EB" stroke-width="2.5" opacity="0.6"/>
  <line x1="145" y1="67" x2="168" y2="50" stroke="#2563EB" stroke-width="2.5" opacity="0.6"/>
  <line x1="55" y1="67" x2="32" y2="50" stroke="#2563EB" stroke-width="2.5" opacity="0.6"/>
  <line x1="100" y1="40" x2="100" y2="18" stroke="#2563EB" stroke-width="2.5" opacity="0.6"/>
  <!-- 外围节点（带光环） -->
  <circle cx="100" cy="170" r="6" fill="url(#p1-node)" filter="url(#p1-glow)"/>
  <circle cx="100" cy="170" r="10" fill="none" stroke="#93C5FD" stroke-width="1" opacity="0.5"/>
  <circle cx="168" cy="135" r="6" fill="url(#p1-node)" filter="url(#p1-glow)"/>
  <circle cx="168" cy="135" r="10" fill="none" stroke="#93C5FD" stroke-width="1" opacity="0.5"/>
  <circle cx="32" cy="135" r="6" fill="url(#p1-node)" filter="url(#p1-glow)"/>
  <circle cx="32" cy="135" r="10" fill="none" stroke="#93C5FD" stroke-width="1" opacity="0.5"/>
  <circle cx="168" cy="50" r="6" fill="url(#p1-node)" filter="url(#p1-glow)"/>
  <circle cx="168" cy="50" r="10" fill="none" stroke="#93C5FD" stroke-width="1" opacity="0.5"/>
  <circle cx="32" cy="50" r="6" fill="url(#p1-node)" filter="url(#p1-glow)"/>
  <circle cx="32" cy="50" r="10" fill="none" stroke="#93C5FD" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="18" r="6" fill="url(#p1-node)" filter="url(#p1-glow)"/>
  <circle cx="100" cy="18" r="10" fill="none" stroke="#93C5FD" stroke-width="1" opacity="0.5"/>
  <!-- 次要连接线（外围节点之间） -->
  <line x1="168" y1="135" x2="100" y2="170" stroke="#93C5FD" stroke-width="1.5" opacity="0.4"/>
  <line x1="32" y1="135" x2="100" y2="170" stroke="#93C5FD" stroke-width="1.5" opacity="0.4"/>
  <line x1="168" y1="50" x2="100" y2="18" stroke="#93C5FD" stroke-width="1.5" opacity="0.4"/>
  <line x1="32" y1="50" x2="100" y2="18" stroke="#93C5FD" stroke-width="1.5" opacity="0.4"/>
  <line x1="168" y1="135" x2="168" y2="50" stroke="#93C5FD" stroke-width="1" opacity="0.2"/>
  <line x1="32" y1="135" x2="32" y2="50" stroke="#93C5FD" stroke-width="1" opacity="0.2"/>
  <!-- 产品名称 -->
  <text x="100" y="180" text-anchor="middle" font-family="PingFang SC, Source Han Sans, sans-serif" font-size="14" font-weight="700" fill="#1E293B">政务智能知识库</text>
  <text x="100" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#64748B">GovAI Knowledge Base</text>
</svg>
